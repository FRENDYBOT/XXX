# Скопіюйте в config.toml ПОЗА репозиторієм (наприклад, C:\Users\<ви>\fop_info\config.toml)
# і вкажіть шлях до нього: --config <шлях> або змінна середовища FOP_INFO_CONFIG.

# Адреси сервера ДПС у порядку спроб. Друга адреса без шифрування, лише запасна.
servers = [
    "https://fs.tax.gov.ua:8643/fs",
    "http://fs.tax.gov.ua:8609/fs",
]

# Скільки секунд чекати відповіді від однієї адреси
timeout_seconds = 10

# Не більше 2 запитів на секунду (більше програма не дозволить)
max_requests_per_second = 2

# Шлях до ключа КЕП касира (етап 2). Пароль тут НЕ зберігається:
# він запитується при запуску або береться зі змінної FOP_INFO_KEY_PASSWORD.
# key_path = "C:\\Users\\<ви>\\keys\\Key-6.dat"
